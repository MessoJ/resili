services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: resili
      POSTGRES_USER: resili
      POSTGRES_PASSWORD: resili
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resili -d resili"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgis-data:/var/lib/postgresql/data
      # The Postgres init entrypoint only executes files placed *directly* in
      # /docker-entrypoint-initdb.d (it does not recurse into sub-directories)
      # and runs them in alphabetical order. Mount each script individually with
      # a numeric prefix so migrations run before the data seeds.
      - ./migrations/0001_risk_and_trigger_audit.sql:/docker-entrypoint-initdb.d/01_0001_risk_and_trigger_audit.sql:ro
      - ./migrations/0002_ward_geometry_and_hazards.sql:/docker-entrypoint-initdb.d/02_0002_ward_geometry_and_hazards.sql:ro
      - ./data/seed-wards.sql:/docker-entrypoint-initdb.d/03_seed-wards.sql:ro
      - ./data/seed-evacuation-centers.sql:/docker-entrypoint-initdb.d/04_seed-evacuation-centers.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  forecast-ingest:
    build:
      context: ../services/forecast-ingest
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://resili:resili@postgis:5432/resili
      REDIS_URL: redis://redis:6379
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim ships no curl/wget; use the stdlib instead.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      GATEWAY_PORT: "8080"
      ML_SERVICE_URL: http://forecast-ingest:8001
      DATABASE_URL: postgresql://resili:resili@postgis:5432/resili
    depends_on:
      postgis:
        condition: service_healthy
      forecast-ingest:
        condition: service_healthy
    healthcheck:
      # alpine runtime image ships busybox wget.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgis-data: